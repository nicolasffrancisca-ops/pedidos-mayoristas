<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F3EF">
<title>Pedidos mayoristas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E5A57' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 7l9-4 9 4-9 4-9-4z'/%3E%3Cpath d='M3 7v10l9 4 9-4V7'/%3E%3Cpath d='M12 11v10'/%3E%3C/svg%3E">
<style>
/* v1.3 · 25/11/2026 — pestaña "Lista de precios" (solo consulta) · v1.2 · 25/11/2026 — precios vigentes del cliente (sin vencimiento) y entrega = próxima ronda (ya no se elige fecha) · v1.1 · 16/11/2026 — precios + IVA */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#1B1A17; --muted:#5E5B54; --line:#E2DFD8; --line2:#EEEBE5;
  --field:#D6D2C9; --accent:#1E5A57; --accent-ink:#FFFFFF; --soft:#E6F0EE; --soft-ink:#1A4D4A;
  --warn-bg:#FCEBD7; --warn-ink:#7A4210; --gray-bg:#E8E6E1; --err:#A3271B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141412; --surface:#1E1D1A; --ink:#EDEBE6; --muted:#A8A49B; --line:#34322D; --line2:#2A2925;
    --field:#4A4740; --accent:#4FA39D; --accent-ink:#0E1A19; --soft:#1F3533; --soft-ink:#B9DCD8;
    --warn-bg:#3E2C17; --warn-ink:#F2C998; --gray-bg:#2E2D29; --err:#F0857A;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none !important}
.btn{white-space:nowrap;height:50px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:0 22px}
.btn:disabled{opacity:.5;cursor:default}
.btn-sec{height:46px;border:1px solid var(--field);border-radius:12px;background:var(--surface);font-weight:600;padding:0 18px}
.link{background:none;border:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
.err{color:var(--err);font-size:14px;min-height:20px;margin:0}
.muted{color:var(--muted)}
/* Ingreso */
#vLogin{padding:32px 24px;flex:1;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:10px;font-weight:600}
.login-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:380px;width:100%;margin:0 auto}
h1{margin:0;font-size:30px;line-height:1.15}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--muted)}
.input{height:50px;border:1px solid var(--field);border-radius:12px;padding:0 14px;background:var(--surface);font-size:16px;width:100%}
#codigo{font-size:20px;letter-spacing:3px;text-transform:uppercase}
textarea.input{height:76px;padding:12px 14px;resize:vertical}
/* Encabezado */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hola{font-size:18px;font-weight:700}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{flex:1;height:44px;border:none;background:none;border-bottom:3px solid transparent;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.ancha{flex:1.4}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat-h b{font-size:17px}
.cat-p{color:var(--accent);font-weight:700;font-size:17px;white-space:nowrap}
.cat-iva{font-size:13px;color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:13px}
.contenido{flex:1;padding:16px 20px 120px;display:flex;flex-direction:column;gap:20px}
.aviso{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px}
.nota{background:var(--soft);color:var(--soft-ink);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.grupo-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.grupo-h b{font-size:15px}
.precio{color:var(--accent);font-weight:600;font-size:14px}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);min-height:56px}
.fila:last-child{border-bottom:none}
.fila.on{background:var(--soft)}
.fila.on .nom{font-weight:600}
.nom{display:flex;flex-direction:column;min-width:0}
.nom small{color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--field);background:var(--surface);font-size:20px;line-height:1}
.fila.on .step .mas{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cant{width:30px;text-align:center;font-weight:700}
.fila:not(.on) .cant{color:var(--muted);font-weight:400}
.vacio{padding:16px;color:var(--muted);font-size:14px}
/* Barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.barra-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot small{display:block;color:var(--muted);font-size:13px}
.tot b{font-size:20px}
/* Revisar */
.det{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.det-f{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.det-f span:last-child{min-width:86px;text-align:right}
.det-t{display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:700;font-size:16px}
.det-sub{display:flex;justify-content:space-between;padding:2px 0;font-size:13px;color:var(--muted)}
.volver{display:flex;align-items:center;gap:12px}
.volver button{width:44px;height:44px;border-radius:10px;border:1px solid var(--field);background:var(--surface);display:flex;align-items:center;justify-content:center}
/* Enviado / Mis pedidos */
.ok-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ok-ico{width:56px;height:56px;border-radius:28px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.ped{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line2)}
.ped:last-child{border-bottom:none}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
.chip.Pendiente{background:var(--warn-bg);color:var(--warn-ink)}
.chip.Confirmado{background:var(--soft);color:var(--soft-ink)}
.chip.Entregado,.chip.Cancelado{background:var(--gray-bg);color:var(--ink)}
@media (prefers-reduced-motion: no-preference){ .fila{transition:background .15s} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1 · Ingreso -->
  <section id="vLogin">
    <div class="marca">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      <span>Pedidos mayoristas</span>
    </div>
    <form class="login-body" id="fLogin" autocomplete="off">
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1>Cargá tu pedido</h1>
        <p class="muted" style="margin:0">Ingresá con el código de acceso que te pasamos.</p>
      </div>
      <div class="campo">
        <label for="codigo">Código de acceso</label>
        <input id="codigo" class="input" type="password" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="20" required>
      </div>
      <button class="btn" id="bIngresar" type="submit">Ingresar</button>
      <p class="err" id="eLogin" role="alert"></p>
      <p class="muted" style="margin:0;font-size:13px;text-align:center">¿No tenés código? Pedíselo a tu proveedor.</p>
    </form>
  </section>

  <!-- 2 · Armar pedido -->
  <section id="vPedido" class="hidden">
    <header class="top">
      <div class="top-row">
        <span class="hola" id="hola"></span>
        <div style="display:flex;gap:14px">
          <button class="link" type="button" id="bMis">Mis pedidos</button>
          <button class="link" type="button" id="bSalir">Salir</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tH" aria-selected="true" type="button">Helado</button>
        <button class="tab" role="tab" id="tI" aria-selected="false" type="button">Insumos</button>
        <button class="tab ancha" role="tab" id="tL" aria-selected="false" type="button">Lista de precios</button>
      </div>
    </header>
    <div class="contenido" id="pH"></div>
    <div class="contenido hidden" id="pI"></div>
    <div class="contenido hidden" id="pL"></div>
  </section>

  <!-- 3 · Revisar y enviar -->
  <section id="vRevisar" class="hidden">
    <header class="top" style="padding-bottom:16px">
      <div class="volver"><button type="button" id="bVolver" aria-label="Volver al pedido"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span class="hola">Revisá tu pedido</span></div>
    </header>
    <div class="contenido">
      <div class="det" id="detalle"></div>
      <div class="nota" id="entregaRev"></div>
      <div class="campo">
        <label for="obs">Observaciones (opcional)</label>
        <textarea id="obs" class="input" maxlength="300"></textarea>
      </div>
      <div class="nota" id="cond"></div>
      <p class="err" id="eEnviar" role="alert"></p>
    </div>
  </section>

  <!-- 4 · Enviado -->
  <section id="vOk" class="hidden">
    <div class="contenido" style="padding-bottom:32px">
      <div class="ok-card">
        <div class="ok-ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M5 12l5 5 9-10"/></svg></div>
        <h1 style="font-size:22px">Pedido enviado</h1>
        <span class="muted" id="okTxt"></span>
        <span style="font-size:14px">Te avisamos cuando lo confirmemos.</span>
        <button class="btn-sec" type="button" id="bOtro" style="margin-top:8px">Hacer otro pedido</button>
      </div>
      <div id="misWrap"></div>
    </div>
  </section>

  <!-- 5 · Mis pedidos -->
  <section id="vMis" class="hidden">
    <header class="top" style="padding-bottom:16px">
      <div class="volver"><button type="button" id="bVolver2" aria-label="Volver al pedido"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><span class="hola">Mis pedidos</span></div>
    </header>
    <div class="contenido" id="misLista"></div>
  </section>
</div>

<div class="barra hidden" id="barra">
  <div class="barra-in">
    <div class="tot"><small id="totSub"></small><b id="totNum"></b></div>
    <button class="btn" type="button" id="bAccion"></button>
  </div>
</div>

<script>
'use strict';
// Pegá acá la URL /exec de la implementación del Apps Script "Pedidos mayoristas".
const API_URL = 'https://script.google.com/macros/s/AKfycbztPKNBW2_4QpVEM1eY0UZF351jAFNJVZ2mQxJBAW5It7aXla0nMdnoIIh5Tyox8YEDHg/exec';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IVA = 0.21; // los precios de la lista son netos
const pesos = (n) => '$ ' + Math.round(n).toLocaleString('es-AR');
const S = { token:'', cliente:'', kgT:6.5, helado:null, insumos:[], cond:{}, entrega:{}, cant:{}, vista:'login', reqId:'' };

function guardar(){ try{ sessionStorage.setItem('pm_s', JSON.stringify(S)); }catch(e){} }
function restaurar(){ try{ const s = JSON.parse(sessionStorage.getItem('pm_s')||'null'); if(s && s.token) Object.assign(S, s); }catch(e){} }
function borrar(){ try{ sessionStorage.removeItem('pm_s'); }catch(e){} }

async function api(body){
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('Falta configurar la dirección del servidor.');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try{
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(body), signal: ctrl.signal });
    return await r.json();
  }catch(e){
    throw new Error('No hay conexión con el servidor. Revisá internet y probá de nuevo.');
  }finally{ clearTimeout(t); }
}

function mostrar(v){
  S.vista = v;
  ['vLogin','vPedido','vRevisar','vOk','vMis'].forEach(id => $(id).classList.toggle('hidden', id !== v));
  pintarBarra();
  window.scrollTo(0,0);
  guardar();
}

/* ---------- Ingreso ---------- */
$('fLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = $('bIngresar'); b.disabled = true; $('eLogin').textContent = '';
  try{
    const r = await api({ action:'login', codigo: $('codigo').value });
    if (!r.ok) { $('eLogin').textContent = r.error || 'No se pudo ingresar.'; return; }
    Object.assign(S, { token:r.token, cliente:r.cliente, kgT:r.kgPorTacho||6.5, helado:r.helado, insumos:r.insumos||[], cond:r.cond||{}, entrega:r.entrega||{}, cant:{} });
    $('codigo').value = '';
    armarCatalogo(); mostrar('vPedido');
  }catch(e){ $('eLogin').textContent = e.message; }
  finally{ b.disabled = false; }
});

$('bSalir').addEventListener('click', () => {
  api({ action:'salir', token:S.token }).catch(()=>{});
  Object.assign(S, { token:'', cant:{} }); borrar(); mostrar('vLogin');
});

function sesionVencida(msg){
  Object.assign(S, { token:'' }); borrar(); mostrar('vLogin');
  $('eLogin').textContent = msg || 'La sesión venció. Ingresá de nuevo.';
}

/* ---------- Entrega (v1.2): la próxima ronda, igual que las franquicias ---------- */
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function entregaTxt(){
  const e = S.entrega || {};
  if (!e.iso) return 'Fecha de entrega <b>a confirmar</b>. Podés hacer el pedido igual: te avisamos el día.';
  const p = e.iso.split('-').map(Number), d = new Date(p[0], p[1]-1, p[2]);
  return 'Próxima entrega: <b>' + DIAS[d.getDay()] + ' ' + esc(e.txt.slice(0,5)) + '</b>' + (e.limite ? ' · pedidos hasta el ' + esc(e.limite.slice(0,5)) : '') + '.';
}

/* ---------- Catálogo ---------- */
function fila(key, nombre, detalle){
  return '<div class="fila" data-k="'+esc(key)+'"><div class="nom"><span>'+esc(nombre)+'</span>'+(detalle?'<small>'+esc(detalle)+'</small>':'')+'</div>'+
    '<div class="step"><button type="button" class="menos" aria-label="Restar '+esc(nombre)+'">−</button>'+
    '<span class="cant" aria-live="polite">0</span>'+
    '<button type="button" class="mas" aria-label="Sumar '+esc(nombre)+'">+</button></div></div>';
}

function armarCatalogo(){
  $('hola').textContent = 'Hola, ' + (S.cliente.split(' ')[0] || S.cliente);
  const h = S.helado || {};
  let html = '<div class="nota">' + entregaTxt() + '</div>';
  if (h.sinLista) {
    html = '<div class="aviso">Todavía no tenés una lista de precios de helado. Pedile una a tu proveedor.</div>';
  } else {
    if (h.vencida) html += '<div class="aviso">Tu lista de precios venció el '+esc(h.validaHasta)+'. Pedile una nueva a tu proveedor para poder pedir helado.</div>';
    else html += '<div class="nota">Se pide por tacho. El importe es un <b>estimado</b> con '+String(S.kgT).replace('.',',')+' kg promedio por tacho: el total final se calcula con el peso real. Precios sin IVA.'+(h.validaHasta ? ' Lista vigente hasta el '+esc(h.validaHasta)+'.' : '')+'</div>';
    (h.escalas||[]).forEach(e => {
      html += '<div><div class="grupo-h"><b>'+esc(e.nombre)+'</b>'+(h.vencida?'':'<span class="precio">'+pesos(e.precioKg)+' /kg + IVA</span>')+'</div><div class="lista">';
      if (h.vencida) html += e.sabores.map(s => '<div class="fila"><div class="nom"><span class="muted">'+esc(s)+'</span></div></div>').join('');
      else html += e.sabores.map(s => fila('h:'+s, s, '')).join('');
      html += '</div></div>';
    });
  }
  $('pH').innerHTML = html;

  let hi = '';
  if (!S.insumos.length) hi = '<div class="lista"><div class="vacio">No hay insumos disponibles por ahora.</div></div>';
  else hi = '<div class="lista">' + S.insumos.map(it => fila('i:'+it.cod, it.nombre, it.presentacion+' · '+pesos(it.precio)+' + IVA')).join('') + '</div>';
  $('pI').innerHTML = hi;
  $('pL').innerHTML = armarLista();
  refrescarFilas();
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('.step button'); if (!b) return;
  const k = b.closest('.fila').dataset.k;
  const n = Math.max(0, Math.min(200, (S.cant[k]||0) + (b.classList.contains('mas') ? 1 : -1)));
  if (n) S.cant[k] = n; else delete S.cant[k];
  refrescarFilas(); guardar();
});

function refrescarFilas(){
  document.querySelectorAll('.fila[data-k]').forEach(f => {
    const n = S.cant[f.dataset.k] || 0;
    f.classList.toggle('on', n > 0);
    f.querySelector('.cant').textContent = n;
  });
  pintarBarra();
}

/* v1.3: lista de precios para consultar (sus precios vigentes, con su % ya aplicado) */
function armarLista(){
  const h = S.helado || {};
  let html = '<div class="nota">Tus precios vigentes por kilo de helado. Se pide por tacho (aprox. '+String(S.kgT).replace('.',',')+' kg) y se cobra por el peso real.</div>';
  if (h.sinLista || !(h.escalas||[]).length) html += '<div class="aviso">Todavía no hay una lista de precios cargada para vos. Consultá a tu proveedor.</div>';
  else if (h.vencida) html += '<div class="aviso">Tu lista de precios venció el '+esc(h.validaHasta)+'. Pedile una nueva a tu proveedor.</div>';
  else (h.escalas||[]).forEach(e => {
    html += '<div class="cat"><div class="cat-h"><b>'+esc(e.nombre)+'</b><span class="cat-p">'+pesos(e.precioKg)+' /kg + IVA</span></div>'+
      '<div class="cat-iva">Con IVA: '+pesos(e.precioKg*(1+IVA))+' /kg</div>'+
      '<div class="chips">'+e.sabores.map(x => '<span>'+esc(x)+'</span>').join('')+'</div></div>';
  });
  if (S.insumos.length) html += '<div><b style="display:block;margin-bottom:8px">Insumos</b><div class="lista">'+S.insumos.map(it =>
    '<div class="fila"><div class="nom"><span>'+esc(it.nombre)+'</span><small>'+esc(it.presentacion)+'</small></div><span style="white-space:nowrap;font-weight:600">'+pesos(it.precio)+' + IVA</span></div>').join('')+'</div></div>';
  const k = S.cond || {}, partes = [];
  if (k.pago) partes.push('<b>Pago:</b> '+esc(k.pago));
  if (k.flete) partes.push('<b>Entrega:</b> '+esc(k.flete));
  if (k.notas) partes.push('<b>Condiciones:</b> '+esc(k.notas));
  if (partes.length) html += '<div class="nota">'+partes.join('<br>')+'</div>';
  return html;
}

function setTab(cual){
  [['H','tH','pH'],['I','tI','pI'],['L','tL','pL']].forEach(([k, t, p]) => {
    $(t).setAttribute('aria-selected', cual===k); $(p).classList.toggle('hidden', cual!==k);
  });
}
$('tH').addEventListener('click', () => setTab('H'));
$('tI').addEventListener('click', () => setTab('I'));
$('tL').addEventListener('click', () => setTab('L'));

/* ---------- Totales ---------- */
function precioHelado(sabor){
  for (const e of (S.helado && S.helado.escalas) || []) if (e.sabores.includes(sabor)) return e.precioKg;
  return 0;
}
function calcular(){
  const lineas = []; let tachos = 0, totH = 0, totI = 0;
  for (const [k, n] of Object.entries(S.cant)) {
    if (k.startsWith('h:')) {
      const sabor = k.slice(2), p = precioHelado(sabor); if (!p || S.helado.vencida) continue;
      const sub = Math.round(n * S.kgT * p); tachos += n; totH += sub;
      lineas.push({ tipo:'helado', sabor, cant:n, nombre:sabor, txt: n+' tacho'+(n>1?'s':''), sub });
    } else {
      const it = S.insumos.find(x => 'i:'+x.cod === k); if (!it) continue;
      const sub = Math.round(n * it.precio); totI += sub;
      lineas.push({ tipo:'insumo', cod:it.cod, cant:n, nombre:it.nombre, txt: it.presentacion==='Unidad' ? n+(n>1?' unidades':' unidad') : n+(n>1?' bultos':' bulto')+it.presentacion.slice(5), sub });
    }
  }
  const neto = totH + totI, iva = Math.round(neto * IVA);
  return { lineas, tachos, totH, totI, neto, iva, total: neto + iva };
}

function pintarBarra(){
  const v = S.vista, c = calcular();
  const ver = (v==='vPedido' || v==='vRevisar') && c.lineas.length > 0;
  $('barra').classList.toggle('hidden', !ver);
  if (!ver) return;
  const partes = [];
  if (c.tachos) partes.push(c.tachos+' tacho'+(c.tachos>1?'s':'')+' ≈ '+(c.tachos*S.kgT).toLocaleString('es-AR')+' kg');
  const nIns = c.lineas.filter(l => l.tipo==='insumo').length;
  if (nIns) partes.push(nIns+' insumo'+(nIns>1?'s':''));
  $('totSub').textContent = partes.join(' y ') + (c.tachos ? ' · estimado' : '');
  $('totNum').textContent = pesos(c.neto) + ' + IVA';
  $('bAccion').textContent = v==='vPedido' ? 'Revisar pedido' : 'Enviar pedido';
}

/* ---------- Revisar y enviar ---------- */
$('bAccion').addEventListener('click', () => { S.vista==='vPedido' ? irRevisar() : enviar(); });
$('bVolver').addEventListener('click', () => mostrar('vPedido'));

function hoyISO(dias){ const d = new Date(); d.setDate(d.getDate()+(dias||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function irRevisar(){
  const c = calcular(); if (!c.lineas.length) return;
  let h = c.lineas.map(l => '<div class="det-f"><span>'+esc(l.nombre)+'</span><span class="muted">'+esc(l.txt)+'</span><span>'+pesos(l.sub)+'</span></div>').join('');
  h += '<div style="padding-top:10px"></div>';
  if (c.totH && c.totI) h += '<div class="det-sub"><span>Helado (estimado)</span><span>'+pesos(c.totH)+'</span></div><div class="det-sub"><span>Insumos</span><span>'+pesos(c.totI)+'</span></div>';
  h += '<div class="det-sub"><span>Subtotal neto</span><span>'+pesos(c.neto)+'</span></div><div class="det-sub"><span>IVA 21%</span><span>'+pesos(c.iva)+'</span></div>';
  h += '<div class="det-t"><span>Total con IVA'+(c.totH?' (estimado)':'')+'</span><span>'+pesos(c.total)+'</span></div>';
  if (c.totH) h += '<p class="muted" style="margin:0 0 10px;font-size:13px">El helado se cobra por el peso real de cada tacho.</p>';
  $('detalle').innerHTML = h;
  $('entregaRev').innerHTML = entregaTxt();
  const k = S.cond || {}, partes = [];
  if (k.pago) partes.push('<b>Pago:</b> '+esc(k.pago));
  if (k.flete) partes.push('<b>Entrega:</b> '+esc(k.flete));
  if (k.notas) partes.push(esc(k.notas));
  $('cond').innerHTML = partes.join('<br>'); $('cond').classList.toggle('hidden', !partes.length);
  $('eEnviar').textContent = '';
  S.reqId = S.reqId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  mostrar('vRevisar');
}

let enviando = false;
async function enviar(){
  if (enviando) return;
  const c = calcular();
  enviando = true; const b = $('bAccion'); b.disabled = true; b.textContent = 'Enviando…'; $('eEnviar').textContent = '';
  try{
    const r = await api({ action:'enviarPedido', token:S.token, reqId:S.reqId, obs:$('obs').value,
      lineas: c.lineas.map(l => l.tipo==='helado' ? { tipo:'helado', sabor:l.sabor, cant:l.cant } : { tipo:'insumo', cod:l.cod, cant:l.cant }) });
    if (r.sesion === false) return sesionVencida(r.error);
    if (!r.ok) { $('eEnviar').textContent = r.error || 'No se pudo enviar.'; return; }
    if (r.entrega) S.entrega = r.entrega;
    $('okTxt').textContent = 'N.º ' + r.id + ' · ' + pesos(r.total) + ' con IVA' + (c.totH ? ' (estimado)' : '') + ' · entrega ' + ((S.entrega && S.entrega.txt) ? S.entrega.txt.slice(0,5) : 'a confirmar');
    S.cant = {}; S.reqId = ''; $('obs').value = '';
    refrescarFilas(); mostrar('vOk'); cargarMis($('misWrap'), true);
  }catch(e){ $('eEnviar').textContent = e.message + ' Si lo volvés a enviar no se duplica.'; }
  finally{ enviando = false; b.disabled = false; pintarBarra(); }
}

/* ---------- Mis pedidos ---------- */
$('bOtro').addEventListener('click', () => mostrar('vPedido'));
$('bMis').addEventListener('click', () => { mostrar('vMis'); cargarMis($('misLista'), false); });
$('bVolver2').addEventListener('click', () => mostrar('vPedido'));

async function cargarMis(el, conTitulo){
  el.innerHTML = '<p class="muted">Cargando…</p>';
  try{
    const r = await api({ action:'misPedidos', token:S.token });
    if (r.sesion === false) return sesionVencida(r.error);
    if (!r.ok) { el.innerHTML = '<p class="err">'+esc(r.error||'No se pudieron cargar.')+'</p>'; return; }
    const t = conTitulo ? '<b style="display:block;margin-bottom:8px">Mis pedidos</b>' : '';
    if (!r.pedidos.length) { el.innerHTML = t + '<div class="lista"><div class="vacio">Todavía no hiciste pedidos.</div></div>'; return; }
    el.innerHTML = t + '<div class="lista">' + r.pedidos.map(p =>
      '<div class="ped"><div class="nom"><span style="font-weight:600">'+esc(p.id)+' · entrega '+esc(p.paraEl || 'a confirmar')+'</span><small>'+
      (p.tachos ? p.tachos+' tacho'+(p.tachos>1?'s':'')+' · ' : '')+pesos(p.total)+'</small></div>'+
      '<span class="chip '+esc(p.estado.replace(/[^A-Za-z]/g,''))+'">'+esc(p.estado)+'</span></div>').join('') + '</div>';
  }catch(e){ el.innerHTML = '<p class="err">'+esc(e.message)+'</p>'; }
}

/* ---------- Inicio ---------- */
restaurar();
if (S.token && S.helado) {
  armarCatalogo();
  const v = (S.vista === 'vRevisar' || S.vista === 'vMis' || S.vista === 'vOk') ? 'vPedido' : (S.vista || 'vPedido');
  mostrar(v === 'vLogin' ? 'vPedido' : v);
} else { mostrar('vLogin'); }
</script>
